nr_passes = 3

[source]
image_dir = "C:\\PIV Videos\\PIV code test\\1Pyramid"
output_dir = "C:\\PIV Videos\\PIV code test\\Output"
frames_to_use = "all"
extra_vel_dim_m = 0.01

[camera]
camera_dir = "C:\\PIV Videos\\PIV code test\\Output\\camera_metadata\\test_P-001_20260107_190541_260107_190912_metadata.json"
calib_dir = "C:\\Uni\\tcm-piv\\examples\\image_pair\\output\\calibration\\calibration_image_260108_141319_metadata.json"
calib_spacing_mm = 1.0

[preprocessing]
downsample_factor = [4, 1, 1]
background_dir = "C:\\PIV Videos\\PIV code test\\Output\\background_260117_144310.tif"
crop_roi = [0, 0, 0, 0]

[correlation]
# [10,10,10] gave best result using 50 frame test set. Crashes on pass 2 with large frame set, set back to [5,5,5]
corrs_to_sum = [10, 10, 10]
nr_windows = [[1, 1], [1, 8], [1, 24]]
#not higher than 0.6, otherwise you get more wrong peaks. Going lower than 0.5 also introdices wrong peaks.
window_overlap = 0.6

[displacement]
# Little higher is better, around 10 is good. So you do not miss any peaks.
nr_peaks = 10
min_peak_distance = 1

[postprocessing]
neighbourhood_size = [[1, 1, 1],[3, 1, 3],[5, 1, 5]]
outlier_filter_mode = "semicircle_rect"
max_velocity = [10, 60]
flow_direction = "y"
extra_vel_dim_m = 0.01
nb_size_tyx = [[9, 1, 1], [7, 1, 3], [9, 1, 3]]
nb_threshold = 5
time_smooth_lam = 0
interp_nb_size_tyx = [1, 1, 7]

[visualisation]
plot_model = false
model_gender = "male"
model_mass = 70.0
model_height = 1.93
plot_global_filters = true
plot_correlations = false
plot_window_layout = true
plot_flow_rate = true
export_velocity_profiles_pdf = true
